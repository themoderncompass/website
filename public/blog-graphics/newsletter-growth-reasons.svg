<svg width="600" height="880" viewBox="0 0 600 880" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="600" height="880" fill="#FFFFFF"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradReasons" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="800">
      <stop offset="0%" style="stop-color:#b324a7"/>
      <stop offset="100%" style="stop-color:#0087c9"/>
    </linearGradient>
  </defs>

  <!-- Connecting line -->
  <line x1="90" y1="80" x2="90" y2="800" stroke="url(#gradReasons)" stroke-width="4" stroke-dasharray="2,14" stroke-linecap="round"/>

  <!-- Node 1 -->
  <g transform="translate(90,80)">
    <circle r="46" fill="#FFFFFF" stroke="url(#gradReasons)" stroke-width="6"/>
    <text text-anchor="middle" dy="15" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">1</text>
    <text x="80" y="12" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#374151">Focus</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(90,260)">
    <circle r="46" fill="#FFFFFF" stroke="url(#gradReasons)" stroke-width="6"/>
    <text text-anchor="middle" dy="15" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">2</text>
    <text x="80" y="12" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#374151">Positioning</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(90,440)">
    <circle r="46" fill="#FFFFFF" stroke="url(#gradReasons)" stroke-width="6"/>
    <text text-anchor="middle" dy="15" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">3</text>
    <text x="80" y="12" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#374151">Identity</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(90,620)">
    <circle r="46" fill="#FFFFFF" stroke="url(#gradReasons)" stroke-width="6"/>
    <text text-anchor="middle" dy="15" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">4</text>
    <text x="80" y="12" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#374151">Funnel</text>
  </g>

  <!-- Node 5 -->
  <g transform="translate(90,800)">
    <circle r="46" fill="#FFFFFF" stroke="url(#gradReasons)" stroke-width="6"/>
    <text text-anchor="middle" dy="15" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">5</text>
    <text x="80" y="12" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#374151">Content</text>
  </g>
</svg>
