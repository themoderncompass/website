    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171321"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset=".76" stop-color="#0087c9"/><stop offset="1" stop-color="#f76a3e"/></linearGradient>
