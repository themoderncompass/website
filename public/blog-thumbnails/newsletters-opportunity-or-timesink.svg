<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradNewsletterThumb" gradientUnits="userSpaceOnUse" x1="290" y1="190" x2="900" y2="440">
      <stop offset="0%" style="stop-color:#b324a7"/>
      <stop offset="100%" style="stop-color:#0087c9"/>
    </linearGradient>
  </defs>

  <!-- A letter weighing down one side of a scale, resting against the counter it sits on -->
  <g>
    <!-- Counter the scale sits on -->
    <line x1="280" y1="431" x2="780" y2="431" stroke="url(#gradNewsletterThumb)" stroke-width="8" stroke-linecap="round"/>

    <!-- Tall fulcrum stand -->
    <polygon points="600,281 555,431 645,431" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Beam, tipped so the letter's side dips down -->
    <line x1="374.5" y1="363.1" x2="825.5" y2="198.9" stroke="url(#gradNewsletterThumb)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="600" cy="281" r="9" fill="url(#gradNewsletterThumb)"/>

    <!-- Left hanger and pan (heavier side, hangs down until it meets the counter) -->
    <line x1="374.5" y1="363.1" x2="374.5" y2="413.1" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>
    <path d="M309.5,413.1 Q374.5,449.1 439.5,413.1" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>

    <!-- Right hanger and pan (empty side, rides higher) -->
    <line x1="825.5" y1="198.9" x2="825.5" y2="248.9" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>
    <path d="M760.5,248.9 Q825.5,284.9 890.5,248.9" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>

    <!-- Envelope, resting in the lower pan, narrower than the pan itself -->
    <rect x="329.5" y="343.1" width="90" height="70" rx="7" fill="#FFFFFF" stroke="url(#gradNewsletterThumb)" stroke-width="7"/>
    <polyline points="329.5,343.1 374.5,378.1 419.5,343.1" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
