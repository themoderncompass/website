<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradNewsletterThumb" gradientUnits="userSpaceOnUse" x1="330" y1="160" x2="870" y2="440">
      <stop offset="0%" style="stop-color:#b324a7"/>
      <stop offset="100%" style="stop-color:#0087c9"/>
    </linearGradient>
  </defs>

  <!-- A letter balanced on a scale -->
  <g>
    <!-- Ground line -->
    <line x1="500" y1="430" x2="700" y2="430" stroke="url(#gradNewsletterThumb)" stroke-width="8" stroke-linecap="round"/>

    <!-- Fulcrum -->
    <polygon points="600,340 555,430 645,430" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Beam -->
    <line x1="380" y1="340" x2="820" y2="340" stroke="url(#gradNewsletterThumb)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="600" cy="340" r="9" fill="url(#gradNewsletterThumb)"/>

    <!-- Left hanger and pan -->
    <line x1="380" y1="340" x2="380" y2="392" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>
    <path d="M335,392 Q380,428 425,392" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>

    <!-- Right hanger and pan -->
    <line x1="820" y1="340" x2="820" y2="392" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>
    <path d="M775,392 Q820,428 865,392" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>

    <!-- Envelope, resting balanced at the center of the beam -->
    <rect x="470" y="166" width="260" height="170" rx="10" fill="#FFFFFF" stroke="url(#gradNewsletterThumb)" stroke-width="7"/>
    <polyline points="470,166 600,251 730,166" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
