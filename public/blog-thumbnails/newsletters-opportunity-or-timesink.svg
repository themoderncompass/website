<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradNewsletterThumb" gradientUnits="userSpaceOnUse" x1="280" y1="170" x2="910" y2="460">
      <stop offset="0%" style="stop-color:#b324a7"/>
      <stop offset="100%" style="stop-color:#0087c9"/>
    </linearGradient>
  </defs>

  <!-- A letter weighing down one side of a scale -->
  <g>
    <!-- Ground line -->
    <line x1="515" y1="325" x2="715" y2="325" stroke="url(#gradNewsletterThumb)" stroke-width="8" stroke-linecap="round"/>

    <!-- Fulcrum -->
    <polygon points="615,245 570,325 660,325" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Beam, tipped so the letter's side dips down -->
    <line x1="375" y1="314" x2="855" y2="176" stroke="url(#gradNewsletterThumb)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="615" cy="245" r="9" fill="url(#gradNewsletterThumb)"/>

    <!-- Left hanger and pan (heavier side, hangs lower) -->
    <line x1="375" y1="314" x2="375" y2="354" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>
    <path d="M310,419 Q375,455 440,419" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>

    <!-- Right hanger and pan (empty side, rides higher) -->
    <line x1="855" y1="176" x2="855" y2="231" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>
    <path d="M790,231 Q855,267 920,231" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="5" stroke-linecap="round"/>

    <!-- Envelope, resting in the lower pan, narrower than the pan itself -->
    <rect x="330" y="354" width="90" height="65" rx="7" fill="#FFFFFF" stroke="url(#gradNewsletterThumb)" stroke-width="7"/>
    <polyline points="330,354 375,386 420,354" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
