<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradNewsletterThumb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="33%" style="stop-color:#FBBF24"/>
      <stop offset="66%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Simple Envelope with Growth Line Drawing -->
  <g transform="translate(600, 330)">
    <!-- Envelope body -->
    <rect x="-230" y="-80" width="290" height="190" rx="10" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7"/>

    <!-- Envelope flap -->
    <polyline points="-230,-80 -85,50 60,-80" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Growth line rising inside the envelope -->
    <polyline points="-190,95 -110,75 -30,50 50,15" fill="none" stroke="url(#gradNewsletterThumb)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Growth markers -->
    <circle cx="-110" cy="75" r="9" fill="url(#gradNewsletterThumb)"/>
    <circle cx="-30" cy="50" r="9" fill="url(#gradNewsletterThumb)"/>
    <circle cx="50" cy="15" r="14" fill="url(#gradNewsletterThumb)"/>
  </g>
</svg>
